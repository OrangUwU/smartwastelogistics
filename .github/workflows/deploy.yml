name: Deploy to Raznar

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Raznar Auto Deploy
        run: |
          curl -X POST "${{ secrets.RAZNAR_WEBHOOK_URL }}" \
            -H "X-Webhook-Token: ${{ secrets.RAZNAR_WEBHOOK_TOKEN }}"
